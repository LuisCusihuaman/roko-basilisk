[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rokobasilisk"
version = "4.0.0"
description = "Self-Modifying AI Agent with Code Improvement Capabilities and Mathematical Decision Theory"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Luis Eduardo Cusihuaman Altagracia", email = "luis@example.com"}
]
keywords = ["ai", "self-modification", "code-improvement", "llama", "pytorch", "decision-theory", "fdt", "tdt", "basilisk", "asi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.6.0", 
    "seaborn>=0.12.0",
    "joblib>=1.3.0",
    # AI/ML Framework Dependencies for Self-Modification
    "torch>=2.1.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "datasets>=2.14.0",
    # Code Analysis and Modification
    "ast-tools>=0.1.2",
    "black>=23.0",
    "autopep8>=2.0.0",
    # Configuration Management
    "pyyaml>=6.0.0",
    # Execution Security
    "docker>=6.1.0",
    "subprocess-tee>=0.4.0",
    # Cloud Infrastructure
    "boto3>=1.29.0",
    "google-cloud-storage>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "build>=0.10.0",
    "twine>=4.0.0",
    "joblib>=1.3.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-jupyter>=0.24.0",
    "mkdocstrings[python]>=0.23.0",
]
web = [
    "streamlit>=1.28.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]
# Phase 3: Memory & Fine-tuning dependencies
memory = [
    "chromadb>=0.4.0",
    "trl>=0.7.0",
    "datasets>=2.14.0",
    "wandb>=0.16.0",
]
all = [
    "rokobasilisk[dev,docs,web,memory]"
]

[project.scripts]
rokobasilisk = "rokobasilisk.cli:main"

[project.urls]
Homepage = "https://github.com/LuisCusihuaman/roko-basilisk"
Repository = "https://github.com/LuisCusihuaman/roko-basilisk"
Documentation = "https://github.com/LuisCusihuaman/roko-basilisk#readme"
Issues = "https://github.com/LuisCusihuaman/roko-basilisk/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rokobasilisk*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmark tests",
]

[tool.coverage.run]
source = ["src/rokobasilisk"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]